[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sidestep-audit"
version = "0.1.0"
description = "A local OpenAI-compatible refusal-observation and recovery gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "aiosqlite>=0.20,<1.0",
  "structlog>=24.4,<26.0",
  "PyYAML>=6.0,<7.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<2.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
